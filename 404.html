<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#123b24" />
  <title>404 - Halaman Tidak Ditemukan | Dusun Kebonrejo 3</title>
  <link rel="icon" href="assets/img/favicon.png" type="image/png" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .page-404 {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(180deg, #f4f8f5 0%, #ffffff 100%);
    }
    .badge-404 {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(31, 98, 58, 0.1);
      color: var(--primary-800, #1f623a);
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      margin-bottom: 16px;
    }
    .title-404 {
      font-size: clamp(3.5rem, 10vw, 6rem);
      font-weight: 900;
      color: var(--primary-950, #0c2b1a);
      margin: 0 0 10px;
      line-height: 1;
    }
    .subtitle-404 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text, #2c3830);
      margin: 0 0 12px;
    }
    .desc-404 {
      max-width: 480px;
      margin: 0 auto 28px;
      color: var(--muted, #657169);
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .btn-group-404 {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .btn-404 {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-404--primary {
      background: var(--primary-800, #1f623a);
      color: #ffffff !important;
    }
    .btn-404--primary:hover {
      background: var(--primary-950, #0c2b1a);
      transform: translateY(-2px);
    }
    .btn-404--secondary {
      background: #ffffff;
      color: var(--primary-900, #16472b) !important;
      border: 1.5px solid var(--primary-700, #286841);
    }
    .btn-404--secondary:hover {
      background: #e9f2ec;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main class="page-404">
    <span class="badge-404">Dusun Kebonrejo 3</span>
    <h1 class="title-404">404</h1>
    <h2 class="subtitle-404">Halaman Tidak Ditemukan</h2>
    <p class="desc-404">
      Mohon maaf, halaman yang Anda cari tidak tersedia, telah dihapus, atau alamat URL yang Anda masukkan salah.
    </p>
    <div class="btn-group-404">
      <a href="index.html" class="btn-404 btn-404--primary">Kembali ke Beranda</a>
      <a href="peta.html" class="btn-404 btn-404--secondary">Buka Peta Interaktif</a>
    </div>
  </main>
</body>
</html>
