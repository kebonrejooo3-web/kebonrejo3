<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420">
  <rect width="100%" height="100%" fill="#e9f2ec"/>
  <!-- Geometric Patterns -->
  <circle cx="150" cy="150" r="220" fill="#1f623a" opacity="0.04"/>
  <circle cx="580" cy="300" r="180" fill="#b68a2b" opacity="0.08"/>
  <polygon points="400,0 700,0 700,300" fill="#123b24" opacity="0.02"/>
  <!-- Centered Store Icon -->
  <g transform="translate(290, 130) scale(2.2)" fill="none" stroke="#123b24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Store Roof/Awning -->
    <path d="M 5,20 L 55,20 L 60,35 L 0,35 Z" fill="#b68a2b" stroke="#b68a2b" opacity="0.9"/>
    <!-- Store Pillars & Base -->
    <rect x="6" y="35" width="48" height="25" fill="#ffffff" stroke-width="3"/>
    <line x1="2" y1="60" x2="58" y2="60"/>
    <!-- Door -->
    <rect x="23" y="42" width="14" height="18" fill="#e9f2ec"/>
    <!-- Window -->
    <rect x="10" y="42" width="10" height="10"/>
    <rect x="40" y="42" width="10" height="10"/>
    <!-- Banner Roof -->
    <path d="M 0,20 L 30,5 L 60,20" stroke-width="5"/>
  </g>
</svg>
