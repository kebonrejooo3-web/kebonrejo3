<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420">
  <rect width="100%" height="100%" fill="#e9f2ec"/>
  <!-- Geometric Patterns -->
  <circle cx="350" cy="350" r="200" fill="#1f623a" opacity="0.04"/>
  <circle cx="350" cy="70" r="150" fill="#b68a2b" opacity="0.08"/>
  <polygon points="500,420 700,420 700,220" fill="#123b24" opacity="0.02"/>
  <!-- Centered Wrench / Gear Icon -->
  <g transform="translate(290, 130) scale(2.2)" fill="none" stroke="#123b24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wrench 1 (Diagonal 1) -->
    <path d="M 10,50 L 45,15" stroke-width="5"/>
    <path d="M 8,42 C 5,45 5,50 8,53 C 11,56 16,56 19,53 L 24,48 M 4,46 L 14,56" stroke-width="4"/>
    <!-- Wrench head -->
    <path d="M 38,22 L 50,10 C 53,7 48,2 45,5 L 38,12 C 36,10 32,10 30,12 C 28,14 28,18 30,20 L 33,23 Z" fill="#ffffff"/>
    <!-- Gear Outline at bottom -->
    <circle cx="28" cy="28" r="7" stroke="#b68a2b" stroke-width="3" opacity="0.8"/>
  </g>
</svg>
